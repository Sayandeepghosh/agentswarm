[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentswarm"
version = "0.1.0"
description = "Cyclic StateGraph multi-agent orchestration runtime with tool calling and reflection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sayandeep Ghosh", email = "sayandeepghosh2023@gmail.com"}
]
dependencies = [
    "pydantic>=2.5.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
agentswarm = "agentswarm.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
